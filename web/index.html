<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Đảo Đèn Lồng</title>
  <!-- Optional web fonts (Vietnamese subset). The game works offline with the serif fallbacks. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Noto+Serif:wght@400;600&display=swap" />
  <style>
    /* Colours of listed UI elements come from the standard palette (web/palette.js). */
    :root {
      --gold: #F2C14E; --text: #F5F1E6; --danger: #FF5A5F; --sky: #0E1430; --fog: #1B2350; --scarf: #C8102E;
      --panel: rgba(14, 20, 48, .82); --panel-2: rgba(27, 35, 80, .9); --gold-dim: rgba(242, 193, 78, .45);
      --serif: "Noto Serif", "Songti SC", "STSong", "Times New Roman", Georgia, serif;
      --title: "Cormorant Garamond", "Noto Serif", Georgia, serif;
    }
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--sky); font-family: var(--serif); color: var(--text); }
    canvas { display: block; }
    .pill { position: fixed; display: flex; align-items: center; gap: 8px; padding: 7px 14px; font-size: 14px; pointer-events: none;
      background: linear-gradient(180deg, var(--panel-2), var(--panel)); border: 1px solid var(--gold-dim); border-radius: 4px;
      box-shadow: 0 0 0 1px rgba(0,0,0,.55), inset 0 0 12px rgba(242,193,78,.08); font-variant-numeric: tabular-nums; }
    .pill::before, .pill::after { content: ""; position: absolute; width: 8px; height: 8px; border: 2px solid var(--gold); }
    .pill::before { top: -3px; left: -3px; border-right: 0; border-bottom: 0; }
    .pill::after { bottom: -3px; right: -3px; border-left: 0; border-top: 0; }
    .lbl { color: var(--gold); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
    .num { font-weight: 600; }
    .big { font-size: 22px; }
    #h-flames { top: 14px; left: 14px; }
    #h-clock { top: 14px; left: 50%; transform: translateX(-50%); }
    #h-clock .num { font-size: 26px; letter-spacing: .05em; }
    #h-clock.danger .num { color: var(--danger); animation: blink .8s steps(2, start) infinite; text-shadow: 0 0 12px var(--danger); }
    @keyframes blink { to { visibility: hidden; } }
    #h-right { top: 14px; right: 14px; flex-direction: column; align-items: flex-end; gap: 4px; }
    #h-right .score { color: var(--gold); font-size: 22px; text-shadow: 0 0 10px rgba(242,193,78,.5); }
    #h-motes { bottom: 16px; left: 50%; transform: translateX(-50%); }
    .cell { width: 18px; height: 18px; border-radius: 50%; border: 1px solid var(--gold-dim); background: rgba(0,0,0,.35); }
    .cell.on { background: radial-gradient(circle at 45% 40%, #FFF6C2, #FFE58A 55%, rgba(255,229,138,.2)); box-shadow: 0 0 10px #FFE58A; border-color: #FFE58A; }
    #h-skills { bottom: 16px; right: 14px; gap: 12px; }
    .skill { position: relative; width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; border: 2px solid var(--gold); font-weight: 700; color: var(--text);
      background: radial-gradient(circle, rgba(242,193,78,.25), rgba(14,20,48,.9)); }
    .skill .cd { position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(rgba(5,8,20,.82) var(--p, 0%), transparent 0); }
    .skill .key { position: relative; font-size: 15px; }
    .skill .name { position: absolute; bottom: -16px; font-size: 10px; color: var(--gold); white-space: nowrap; }
    .skill.off { opacity: .55; border-color: var(--gold-dim); }
    .flame { width: 18px; height: 22px; border-radius: 50% 50% 45% 45% / 60% 60% 40% 40%; background: rgba(255,255,255,.08); border: 1px solid var(--gold-dim); }
    .flame.on { background: radial-gradient(circle at 50% 65%, #FFE9B0, #FFB347 50%, #e0521f 85%); border-color: #FFB347; box-shadow: 0 0 10px #FFB347; animation: flick 1.3s ease-in-out infinite; }
    @keyframes flick { 50% { transform: scale(1.1) translateY(-1px); } }
    .flash { animation: flash .45s ease-out; }
    @keyframes flash { from { box-shadow: 0 0 0 3px var(--danger), 0 0 24px var(--danger); } }
    #prompt { position: fixed; bottom: 70px; left: 50%; transform: translateX(-50%); font-size: 18px; text-shadow: 0 0 10px #FFB347, 0 0 2px #000; pointer-events: none; white-space: nowrap; }
    #prompt b { color: var(--gold); }
    #arrow { position: fixed; width: 0; height: 0; border-left: 14px solid transparent; border-right: 14px solid transparent; border-bottom: 26px solid var(--gold);
      filter: drop-shadow(0 0 8px #FFB347); pointer-events: none; display: none; transform-origin: 50% 60%; }
    #banner { position: fixed; top: 20%; left: 50%; transform: translate(-50%, -10px); font-family: var(--title); font-size: 34px; font-weight: 700; color: var(--gold);
      text-shadow: 0 0 18px #FFB347, 0 2px 0 #000; opacity: 0; transition: opacity .35s, transform .35s; pointer-events: none; white-space: nowrap; }
    #banner.show { opacity: 1; transform: translate(-50%, 0); }
    #banner.danger { color: #d9c8ff; text-shadow: 0 0 18px #7A3CFF, 0 2px 0 #000; }
    #vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, transparent 55%, rgba(5, 8, 20, .55) 100%); }
    #vignette.hit { animation: hit .6s ease-out; }
    @keyframes hit { from { background: radial-gradient(ellipse at center, rgba(122, 60, 255, .12) 30%, rgba(80, 20, 160, .85) 100%); } }
    #hud.hidden .pill, #hud.hidden #prompt, #hud.hidden #arrow { display: none !important; }
    #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: radial-gradient(ellipse at center, rgba(14,20,48,.35), rgba(5,8,20,.82)); padding: 16px; }
    #overlay.hidden { display: none; }
    .card { position: relative; text-align: center; width: min(600px, 100%); box-sizing: border-box; padding: 34px 36px 28px;
      background: linear-gradient(180deg, rgba(27,35,80,.96), rgba(14,20,48,.97)); border: 1px solid var(--gold); outline: 1px solid rgba(242,193,78,.35); outline-offset: 6px;
      box-shadow: 0 0 60px rgba(255, 179, 71, .22); }
    .card h1 { margin: 6px 0 2px; font-family: var(--title); font-size: 50px; line-height: 1.05;
      background: linear-gradient(180deg, #FFE9B0 10%, #F2C14E 55%, #c9822a 90%); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .sub { color: var(--gold); letter-spacing: .22em; text-transform: uppercase; font-size: 13px; }
    .divider { height: 14px; margin: 12px auto 8px; width: 70%; background: linear-gradient(90deg, transparent, var(--gold) 30%, var(--gold) 70%, transparent) center / 100% 1px no-repeat,
      radial-gradient(circle, var(--gold) 3px, transparent 4px) center / 14px 14px no-repeat; }
    .card p { line-height: 1.65; margin: 8px 0; font-size: 15px; }
    .card .quote { font-style: italic; border-left: 2px solid var(--gold); padding-left: 12px; text-align: left; }
    .card .big b { color: var(--gold); }
    .seal { position: absolute; top: -26px; left: 50%; transform: translateX(-50%) rotate(-4deg); width: 52px; height: 52px; display: grid; place-items: center;
      background: var(--scarf); color: var(--text); font-size: 30px; font-weight: 700; border: 2px solid var(--gold); border-radius: 6px; }
    .menu { display: flex; flex-direction: column; gap: 10px; align-items: center; margin-top: 16px; }
    .btn { min-width: 220px; padding: 10px 26px; font-family: var(--title); font-size: 20px; font-weight: 700; letter-spacing: .06em; cursor: pointer; color: #2a1606;
      background: linear-gradient(180deg, #FFE9B0, #F2C14E 60%, #c97a20); border: 1px solid #FFE9B0; border-radius: 3px; }
    .btn.ghost { background: transparent; color: var(--text); border-color: var(--gold-dim); }
    .btn:focus-visible, .btn:hover { outline: 2px solid var(--text); }
    .keys { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 14px; margin: 12px 0 4px; font-size: 13px; }
    kbd { display: inline-block; padding: 1px 7px; border: 1px solid var(--gold-dim); border-bottom-width: 2px; border-radius: 4px; background: #1B2350; color: var(--gold); font-family: inherit; font-size: 12px; }
    .row { display: grid; grid-template-columns: 1fr 2fr 48px; gap: 10px; align-items: center; margin: 12px 0; text-align: left; }
    .row input { width: 100%; accent-color: #F2C14E; }
    table.nights { margin: 10px auto; border-collapse: collapse; } table.nights td { padding: 3px 12px; border-bottom: 1px solid rgba(242,193,78,.2); }
    @media (max-width: 640px) { .card h1 { font-size: 36px; } .card { padding: 30px 18px 22px; } #banner { font-size: 22px; } .cell { width: 13px; height: 13px; } }
  </style>
  <script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
</head>
<body>
  <div id="vignette"></div>
  <div id="hud" class="hidden">
    <div class="pill" id="h-flames"></div>
    <div class="pill" id="h-clock"><span class="lbl">Canh giờ</span><span class="num">5:00</span></div>
    <div class="pill" id="h-right"></div>
    <div class="pill" id="h-motes"></div>
    <div class="pill" id="h-skills"></div>
    <div id="prompt"></div>
    <div id="arrow"></div>
  </div>
  <div id="banner"></div>
  <div id="overlay"><div class="card" id="card"></div></div>
  <script type="module" src="./main.js"></script>
</body>
</html>
