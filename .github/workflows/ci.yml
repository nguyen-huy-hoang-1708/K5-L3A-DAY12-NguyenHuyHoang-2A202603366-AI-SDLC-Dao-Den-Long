name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '${{ matrix.node }}' }
      - run: npm test
      - run: ./tools/mutation-check.sh
      - name: Creative additions (web/) do not change headless output
        run: |
          git fetch --tags origin 2>/dev/null || true
          ./tools/creative-check.sh
      - name: Headless contract smoke + determinism
        run: |
          node headless/run.js --seed 9 --night 1 --ticks 3000 --out a.jsonl
          node headless/run.js --seed 9 --night 1 --ticks 3000 --out b.jsonl
          cmp a.jsonl b.jsonl
          tail -1 a.jsonl
